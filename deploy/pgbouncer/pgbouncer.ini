; PgBouncer — transaction pooling in front of PostgreSQL primary + replica.
; Transaction mode multiplexes many app connections onto few server connections,
; which is why the app pool (asyncpg) can stay small. See pool-sizing in
; docs/V521_POSTGRESQL_PLATFORM.md.
[databases]
career      = host=pg-primary port=5432 dbname=career
career_ro   = host=pg-replica port=5432 dbname=career

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 5000           ; app-facing connections (cheap)
default_pool_size = 50           ; server connections per (db,user) — medium tier
reserve_pool_size = 10
reserve_pool_timeout = 3
server_idle_timeout = 300
server_lifetime = 1800           ; recycle server connections
query_wait_timeout = 30          ; backpressure: fail fast when saturated
ignore_startup_parameters = extra_float_digits

; Prometheus exporter scrapes SHOW POOLS / SHOW STATS via pgbouncer_exporter.
