services:
  career-engine:
    build: .
    image: career-intelligence-engine:1.0.0
    container_name: career-engine
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      # Persist DB + checkpoints across restarts
      - ./data:/app/data
      # Persist generated exports (jobs_master.xlsx + documents) to the host
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
