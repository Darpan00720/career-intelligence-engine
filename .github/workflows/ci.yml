name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (syntax / compile)
        run: |
          python -m compileall -q api core graph schemas services tests

      - name: Run test suite (deterministic)
        env:
          PYTHONHASHSEED: "0"
          NON_ENGLISH_AUTO_REJECT: "false"
        run: |
          python -m unittest discover -s tests

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t career-intelligence-engine:ci .
      - name: Verify image starts and is healthy
        run: |
          docker run -d --name ci-engine -p 8000:8000 career-intelligence-engine:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/health; then echo "healthy"; break; fi
            sleep 2
          done
          curl -fs http://127.0.0.1:8000/version
          docker rm -f ci-engine
