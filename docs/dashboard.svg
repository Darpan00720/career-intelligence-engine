<svg viewBox="0 0 1120 350" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Illustrative example of jobs_master.xlsx — ranked, colour-coded Netherlands and Italy internship matches">
