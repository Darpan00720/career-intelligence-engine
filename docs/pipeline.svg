<svg viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Animated walkthrough of the pipeline running through its seven steps in sequence">
  <defs>
    <pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="#e6e6ee"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#101020" flood-opacity="0.09"/></filter>
  </defs>

  <rect x="0" y="0" width="600" height="480" fill="#f7f7fb"/>
  <rect x="0" y="0" width="600" height="480" fill="url(#g)"/>
  <text x="40" y="36" font-size="15" font-weight="700" fill="#2b2b36">Running the pipeline — every step, one pass</text>

  <!-- spine + play head -->
  <line x1="26" y1="85" x2="26" y2="397" stroke="#e0e0e8" stroke-width="2"/>
  <circle cx="26" cy="85" r="5" fill="#4a8df0">
    <animate attributeName="cy" values="85;137;189;241;293;345;397" keyTimes="0;0.143;0.286;0.429;0.571;0.714;0.857" dur="11.2s" calcMode="discrete" repeatCount="indefinite"/>
  </circle>

  <!-- step cards -->
  <!-- 1 Search -->
  <g><rect x="40" y="64" width="512" height="42" rx="11" fill="#fff" stroke="#e6e6ee" stroke-width="1.4" filter="url(#sh)"/>
    <rect x="50" y="71" width="28" height="28" rx="8" fill="#2eb8a6"/><text x="64" y="90" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="88" y="83" font-size="13" font-weight="700" fill="#2b2b36">Search</text>
    <text x="88" y="98" font-size="10.5" fill="#8a8a99">Adzuna + ATS APIs · ~9,700 roles found</text></g>
  <!-- 2 Filter -->
  <g><rect x="40" y="116" width="512" height="42" rx="11" fill="#fff" stroke="#e6e6ee" stroke-width="1.4" filter="url(#sh)"/>
    <rect x="50" y="123" width="28" height="28" rx="8" fill="#f0a93b"/><text x="64" y="142" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="88" y="135" font-size="13" font-weight="700" fill="#2b2b36">Filter / Eligibility</text>
    <text x="88" y="150" font-size="10.5" fill="#8a8a99">Netherlands + Italy · interns · English-sufficient</text></g>
  <!-- 3 Scoring -->
  <g><rect x="40" y="168" width="512" height="42" rx="11" fill="#fff" stroke="#e6e6ee" stroke-width="1.4" filter="url(#sh)"/>
    <rect x="50" y="175" width="28" height="28" rx="8" fill="#4a8df0"/><text x="64" y="194" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="88" y="187" font-size="13" font-weight="700" fill="#2b2b36">Scoring</text>
    <text x="88" y="202" font-size="10.5" fill="#8a8a99">0–100 vs CV · semantic skills match</text></g>
  <!-- 4 Research -->
  <g><rect x="40" y="220" width="512" height="42" rx="11" fill="#fff" stroke="#e6e6ee" stroke-width="1.4" filter="url(#sh)"/>
    <rect x="50" y="227" width="28" height="28" rx="8" fill="#8b7bf0"/><text x="64" y="246" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="88" y="239" font-size="13" font-weight="700" fill="#2b2b36">Research</text>
    <text x="88" y="254" font-size="10.5" fill="#8a8a99">company intel for the strong matches</text></g>
  <!-- 5 Recommendation -->
  <g><rect x="40" y="272" width="512" height="42" rx="11" fill="#fff" stroke="#e6e6ee" stroke-width="1.4" filter="url(#sh)"/>
    <rect x="50" y="279" width="28" height="28" rx="8" fill="#ea4b71"/><text x="64" y="298" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="88" y="291" font-size="13" font-weight="700" fill="#2b2b36">Recommendation</text>
    <text x="88" y="306" font-size="10.5" fill="#8a8a99">prioritise &amp; rank what to apply to</text></g>
  <!-- 6 Documents -->
  <g><rect x="40" y="324" width="512" height="42" rx="11" fill="#fff" stroke="#e6e6ee" stroke-width="1.4" filter="url(#sh)"/>
    <rect x="50" y="331" width="28" height="28" rx="8" fill="#36b37e"/><text x="64" y="350" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
    <text x="88" y="343" font-size="13" font-weight="700" fill="#2b2b36">Documents</text>
    <text x="88" y="358" font-size="10.5" fill="#8a8a99">tailored résumé + cover letter</text></g>
  <!-- 7 Export -->
  <g><rect x="40" y="376" width="512" height="42" rx="11" fill="#fff" stroke="#e6e6ee" stroke-width="1.4" filter="url(#sh)"/>
    <rect x="50" y="383" width="28" height="28" rx="8" fill="#ff6d5a"/><text x="64" y="402" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text>
    <text x="88" y="395" font-size="13" font-weight="700" fill="#2b2b36">Export / Tracker</text>
    <text x="88" y="410" font-size="10.5" fill="#8a8a99">jobs_master.xlsx + application log</text></g>

  <!-- moving highlight (translucent, on top) -->
  <rect x="36" y="64" width="520" height="42" rx="11" fill="#4a8df0" stroke="#4a8df0" stroke-width="1.6" opacity="0.14">
    <animate attributeName="y" values="64;116;168;220;272;324;376" keyTimes="0;0.143;0.286;0.429;0.571;0.714;0.857" dur="11.2s" calcMode="discrete" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.10;0.22;0.10" dur="1.6s" repeatCount="indefinite"/>
  </rect>

  <!-- completion checks (fade in as each step finishes, reset on loop) -->
  <g>
    <g transform="translate(528,85)"><circle r="9" fill="#36b37e"/><path d="M-4,0 L-1.5,3 L4,-3.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.99;1" dur="11.2s" calcMode="discrete" repeatCount="indefinite"/></g>
    <g transform="translate(528,137)"><circle r="9" fill="#36b37e"/><path d="M-4,0 L-1.5,3 L4,-3.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.193;0.99;1" dur="11.2s" calcMode="discrete" repeatCount="indefinite"/></g>
    <g transform="translate(528,189)"><circle r="9" fill="#36b37e"/><path d="M-4,0 L-1.5,3 L4,-3.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.336;0.99;1" dur="11.2s" calcMode="discrete" repeatCount="indefinite"/></g>
    <g transform="translate(528,241)"><circle r="9" fill="#36b37e"/><path d="M-4,0 L-1.5,3 L4,-3.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.479;0.99;1" dur="11.2s" calcMode="discrete" repeatCount="indefinite"/></g>
    <g transform="translate(528,293)"><circle r="9" fill="#36b37e"/><path d="M-4,0 L-1.5,3 L4,-3.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.621;0.99;1" dur="11.2s" calcMode="discrete" repeatCount="indefinite"/></g>
    <g transform="translate(528,345)"><circle r="9" fill="#36b37e"/><path d="M-4,0 L-1.5,3 L4,-3.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.764;0.99;1" dur="11.2s" calcMode="discrete" repeatCount="indefinite"/></g>
    <g transform="translate(528,397)"><circle r="9" fill="#36b37e"/><path d="M-4,0 L-1.5,3 L4,-3.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.907;0.99;1" dur="11.2s" calcMode="discrete" repeatCount="indefinite"/></g>
  </g>

  <text x="40" y="452" font-size="10.5" fill="#8a8a99">Animated walkthrough · loops every ~11s · one real pass takes a few minutes</text>
</svg>
