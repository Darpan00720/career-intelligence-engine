global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: career-api
    metrics_path: /api/v2/metrics/prometheus
    static_configs:
      - targets: ["api:8000"]

  - job_name: career-workers
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]

# SLO recording/alerting rules live in rules/*.yml (mounted separately).
# Error-budget burn alerts target 99.95% availability (≈ 21m 54s/month).
